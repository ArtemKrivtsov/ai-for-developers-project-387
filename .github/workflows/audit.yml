name: audit

# Daily Lighthouse audit of the deployed app. A plain step collects the report, the OpenCode
# agent reads its summary, files an issue for each new finding and logs the run.
on:
  schedule:
    # Once a day, 06:17 in Moscow.
    - cron: '17 6 * * *'
      timezone: Europe/Moscow
  workflow_dispatch:
    inputs:
      report:
        description: 'live: audit APP_URL; training: the prepared training report with a known finding'
        type: choice
        options: [live, training]
        default: live

permissions: {}

# One audit at a time; a scheduled run waits for a manual one instead of racing it.
concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      APP_URL: ${{ vars.APP_URL }}
      MODE: ${{ inputs.report || 'live' }}
      # Outside the working tree: the report is never part of a commit.
      OUT: /tmp/audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - run: pnpm install --frozen-lockfile --filter audit

      # The free Render service sleeps: wake it up before measuring.
      - name: Wake up the app
        id: wake
        if: env.MODE == 'live'
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::The APP_URL repository variable is not set."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null -m 60 "$APP_URL"; then
              echo "up=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt: $APP_URL is not answering yet"
            sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"

      - name: Lighthouse
        if: env.MODE == 'live' && steps.wake.outputs.up == 'true'
        run: |
          mkdir -p "$OUT"
          CHROME_PATH=$(command -v google-chrome) pnpm --dir audit exec lighthouse "$APP_URL" \
            --quiet --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output=html --output-path="$OUT/lighthouse"
          node audit/summarize.mjs "$OUT/lighthouse.report.json" "$OUT"

      - name: Training report
        if: env.MODE == 'training'
        run: |
          mkdir -p "$OUT"
          cp audit/fixtures/training-report.json "$OUT/lighthouse.report.json"
          node audit/summarize.mjs "$OUT/lighthouse.report.json" "$OUT"

      # No data is not "no findings": say so explicitly, so it never reads as a fixed defect.
      - name: Mark the app as unavailable
        if: env.MODE == 'live' && steps.wake.outputs.up != 'true'
        run: |
          mkdir -p "$OUT"
          printf '{"unavailable": true, "url": "%s", "findings": []}\n' "$APP_URL" > "$OUT/summary.json"
          printf '# Отчёт аудита\n\nНет данных: приложение %s не ответило за 2 минуты. Это не значит, что прежние находки исправлены.\n' "$APP_URL" > "$OUT/summary.md"

      - name: Summary of the run
        if: always()
        run: cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Reports live outside the working tree and only as an artifact, never in a commit.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-report-${{ github.run_id }}
          if-no-files-found: ignore
          path: /tmp/audit/
          retention-days: 90

  agent:
    needs: collect
    # The journal records every run, a failed collection too.
    if: always() && needs.collect.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The agent reads the repository and issues and creates or comments issues with the runner
    # token. It changes no code and opens no PR, so it gets no contents: write and no OIDC.
    permissions:
      contents: read
      issues: write
    env:
      MODE: ${{ inputs.report || 'live' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .audit/ is git-ignored: the report never ends up in a commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: audit-report-${{ github.run_id }}
          path: .audit

      # A failed collection is "no data", reported as such, never "no findings".
      - name: Mark a failed collection
        env:
          COLLECT: ${{ needs.collect.result }}
        run: |
          mkdir -p .audit
          if [ "$COLLECT" != success ] || [ ! -s .audit/summary.json ]; then
            printf '{"unavailable": true, "collectFailed": true, "findings": []}\n' > .audit/summary.json
            printf '# Отчёт аудита\n\nНет данных: сбор отчёта завершился с результатом %s, см. лог прогона. Задачи по находкам не заводятся.\n' "$COLLECT" > .audit/summary.md
          fi

      # One pinned release, checked against its published SHA-256 before it runs.
      - name: Install OpenCode CLI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: 588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a
        run: |
          gh release download v1.19.5 --repo anomalyco/opencode --pattern opencode-linux-x64.tar.gz --dir /tmp
          echo "$SHA256  /tmp/opencode-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf /tmp/opencode-linux-x64.tar.gz -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Agent reads the report
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # The agent writes only its conclusion file and runs only the gh issue commands it
          # needs: no --output or redirection, nothing outside the checkout, no prompts.
          OPENCODE_CONFIG_CONTENT: >-
            {"small_model": "opencode/deepseek-v4.1-flash-free", "share": "disabled",
            "permission": {"edit": {"*": "deny", ".audit/agent-output.md": "allow", "*/.audit/agent-output.md": "allow"},
            "bash": {"*": "deny", "gh issue list*": "allow", "gh issue view*": "allow",
            "gh issue create*": "allow", "gh issue comment*": "allow", "gh label list*": "allow",
            "*--output*": "deny", "*>*": "deny"},
            "webfetch": "deny",
            "external_directory": "deny",
            "doom_loop": "deny",
            "read": {"*": "allow", "*.env": "deny", "*.env.*": "deny", "*.env.example": "allow"}}}
        shell: bash
        run: |
          prompt="Ты агент регулярного аудита репозитория ${GITHUB_REPOSITORY}. Прогон: ${RUN_URL}. Режим: ${MODE}.
          Прочитай AGENTS.md, docs/agents/issue-tracker.md, затем отчёт: .audit/summary.md и .audit/summary.json. Полный отчёт Lighthouse лежит в артефакте audit-report-${GITHUB_RUN_ID} этого прогона.
          Проверялось развёрнутое приложение по адресу из отчёта: это деплой на Render из репозитория первого проекта ai-for-developers-project-386 с тем же кодом календаря. Так и укажи.
          Для каждой находки из summary.json (поле fingerprint):
          1. Найди существующую задачу: gh issue list --state all --label audit --search \"<fingerprint> in:body\" --json number,state,title,body.
          2. Если открытая задача с этим fingerprint есть и новых сведений нет, ничего не создавай и не комментируй.
          3. Если задачи нет, создай одну: gh issue create --label audit,needs-triage (для учебного отчёта, где training=true: --label audit,учебный и префикс [Учебный] в заголовке). В теле: проблема своими словами, на какой странице и какое приложение проверялось, предлагаемое действие, ссылка на прогон ${RUN_URL} и строка «Отпечаток находки: \`<fingerprint>\`». Учебная задача прямо говорит, что это подготовленные данные, а не подтверждённый дефект.
          4. Если задача есть, но закрыта, создай новую и сошлись на закрытую: проблема появилась снова.
          Если unavailable=true, задач не создавай: данных нет, это не значит, что находки исправлены.
          В конце найди журнал: gh issue list --state open --label audit-log --json number --jq '.[0].number' и оставь в нём один комментарий: режим, страница, оценки категорий, список находок с номерами созданных или уже существующих задач (или «находок нет», или «нет данных»), ссылка на прогон ${RUN_URL} и на артефакт audit-report-${GITHUB_RUN_ID}.
          Тот же текст запиши в файл .audit/agent-output.md инструментом записи файлов. Код и другие файлы не меняй, ветки и PR не создавай."
          opencode run --model opencode/deepseek-v4.1-flash-free "$prompt" | tee .audit/agent-run.log

      - name: Require the conclusion
        run: |
          if [ ! -s .audit/agent-output.md ]; then
            echo "::error::The agent wrote no conclusion."
            exit 1
          fi
          cat .audit/agent-output.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-agent-${{ github.run_id }}
          path: |
            .audit/agent-output.md
            .audit/agent-run.log
          if-no-files-found: ignore
          retention-days: 90

  # Without a model: when the agent itself fails, the journal still gets the run.
  log-failure:
    needs: [collect, agent]
    if: always() && (needs.agent.result == 'failure' || needs.agent.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Write the failure to the journal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COLLECT: ${{ needs.collect.result }}
          AGENT: ${{ needs.agent.result }}
          MODE: ${{ inputs.report || 'live' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          journal=$(gh issue list --repo "$REPO" --state open --label audit-log --json number --jq '.[0].number')
          if [ -z "$journal" ]; then
            echo "::error::No open issue with the audit-log label."
            exit 1
          fi
          printf '**Аудит (%s) без вывода агента: нужен человек.**\n\n- Сбор отчёта: %s\n- Агент: %s\n- Прогон: %s\n- Отчёт, если собран: артефакт audit-report-%s\n' \
            "$MODE" "$COLLECT" "$AGENT" "$RUN_URL" "$GITHUB_RUN_ID" > comment.md
          gh issue comment "$journal" --repo "$REPO" --body-file comment.md
